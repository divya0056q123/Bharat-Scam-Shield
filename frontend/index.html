<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bharat Scan Shield</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;800&family=Noto+Sans+Devanagari:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{--bg:#081714;--bg2:#0f2825;--ink:#ecfffc;--mute:#b1dad2;--card:rgba(12,25,24,0.9);--green:#39e7a6;--green-deep:#1fb788;--green-soft:#163d37;--teal:#72f0dc;--amber:#ffc857;--red:#ff7575;--ok:#4ae0a3;--line:rgba(114,240,220,0.18);--shadow:0 26px 70px rgba(0,0,0,0.38)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top left,#123834 0%, #0d2a29 18%, #091c1b 48%, #060d0d 100%);color:var(--ink);font:17px/1.6 "Segoe UI","Noto Sans","Noto Sans Devanagari",sans-serif}
main{max-width:820px;margin:0 auto;padding:24px 18px 56px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
h1{font-size:2.8rem;font-weight:900;margin:0;letter-spacing:-1.2px;line-height:1.03;background:linear-gradient(135deg,#f1fffb,#b9f6e3,#bfeaf8);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 24px rgba(123,255,220,.12);font-family:"Segoe UI","Noto Sans","Noto Sans Devanagari",sans-serif}
.tag{color:var(--mute);margin:6px 0 0;font-weight:700;letter-spacing:.02em}
.hero-badge{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(114,240,220,0.25);background:linear-gradient(135deg,rgba(57,231,166,.12),rgba(114,240,220,.06));color:var(--teal);padding:8px 12px;border-radius:999px;font-size:.76rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px;box-shadow:0 12px 28px rgba(57,231,166,.12)}
.hero-badge::before{content:"●";color:var(--green);font-size:.8rem}
.hero-pills{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.hero-pills span{display:inline-flex;align-items:center;padding:8px 12px;border-radius:999px;background:linear-gradient(135deg,rgba(15,27,27,.9),rgba(17,35,35,.86));border:1px solid rgba(114,240,220,.12);color:var(--teal);font-weight:800;font-size:.78rem;box-shadow:0 10px 20px rgba(0,0,0,.14)}
.lang{display:inline-flex;padding:4px;border-radius:999px;background:rgba(114,240,220,.08);border:1px solid rgba(114,240,220,.12)}
.lang button{border:none;background:transparent;color:var(--ink);padding:8px 14px;font:inherit;cursor:pointer;border-radius:999px;font-weight:800;transition:.2s ease}
.lang button.on{background:linear-gradient(135deg,var(--green),var(--teal));color:#071f1c;box-shadow:0 16px 28px rgba(57,231,166,.26)}
textarea{width:100%;min-height:180px;padding:18px 16px;font:500 1rem/1.7 "Segoe UI","Noto Sans","Noto Sans Devanagari",sans-serif;border:2px solid rgba(114,240,220,.18);border-radius:18px;background:rgba(8,17,17,.96);color:var(--ink);box-shadow:inset 0 2px 5px rgba(114,240,220,.04), 0 18px 34px rgba(0,0,0,.14);transition:border-color .2s ease, box-shadow .2s ease}
textarea:focus,button:focus-visible{outline:none;border-color:rgba(114,240,220,.5);box-shadow:0 0 0 4px rgba(114,240,220,.1), 0 16px 32px rgba(0,0,0,.18)}
.row{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0 8px}
.btn{padding:13px 18px;border-radius:14px;border:1px solid rgba(114,240,220,.16);background:rgba(16,28,28,.82);color:var(--ink);font:800 0.97rem "Segoe UI","Noto Sans","Noto Sans Devanagari",sans-serif;cursor:pointer;box-shadow:0 12px 24px rgba(0,0,0,.12);transition:transform .15s ease, box-shadow .15s ease}
.btn:hover{transform:translateY(-1px)}
.btn.main{background:linear-gradient(135deg,#39e7a6,#1ebd86,#72f0dc);color:#081d1a;border:none;flex:1;min-width:180px;box-shadow:0 20px 34px rgba(57,231,166,.26)}
.btn.secondary{background:rgba(114,240,220,.07);border-color:rgba(114,240,220,.14)}
.btn:disabled{opacity:.7;cursor:not-allowed}
.hint{font-size:.9rem;color:var(--mute)}
.samples{margin:10px 0 18px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}.samples a{color:var(--teal);margin-right:4px;cursor:pointer;text-decoration:none;background:rgba(114,240,220,.08);padding:6px 10px;border-radius:999px;border:1px solid rgba(114,240,220,.12);font-weight:700}
.meta-grid{display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:10px;margin:16px 0 18px}
.meta{background:rgba(15,29,29,.8);border:1px solid rgba(114,240,220,.12);border-radius:18px;padding:12px 14px;box-shadow:0 14px 28px rgba(0,0,0,.08)}
.meta span{display:block;font-size:.75rem;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.meta strong{display:block;margin-top:6px;font-size:1.5rem;color:var(--ink)}
#out{display:none;background:var(--card);border-radius:26px;padding:22px;border:1px solid rgba(114,240,220,.12);box-shadow:var(--shadow);backdrop-filter:blur(5px)}
#categoryBadges{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 10px}
.badge{padding:7px 10px;border-radius:999px;background:rgba(114,240,220,.08);border:1px solid rgba(114,240,220,.14);font-size:.74rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--teal)}
.meter{display:flex;gap:6px;margin:8px 0 16px}.meter i{flex:1;height:12px;border-radius:999px;background:linear-gradient(90deg,#112d2b,#173a39)}
.high .meter i{background:linear-gradient(90deg,#ff9999,#ff5d5d)}.medium .meter i:nth-child(-n+2){background:linear-gradient(90deg,#ffd76c,#ffc857)}.low .meter i:nth-child(1){background:linear-gradient(90deg,#76efb4,#32c780)}
.label{font-size:1.6rem;font-weight:800;margin:0}.high .label{color:#ff8d8d}.medium .label{color:#ffd76c}.low .label{color:#82f9cb}
.sig{border-left:6px solid #ffc857;padding:12px 14px;margin:12px 0;background:linear-gradient(135deg,rgba(255,200,87,.08),rgba(255,255,255,.02));border-radius:0 12px 12px 0;box-shadow:0 12px 24px rgba(0,0,0,.12)}.sig b{display:block;font-size:1rem;color:var(--ink)}.sig small{color:var(--mute)}
h2{font-size:1.08rem;margin:22px 0 6px;color:var(--teal)}
ul{padding-left:20px}li{margin:6px 0}
.disc{font-size:.85rem;color:var(--mute);margin-top:18px;border-top:1px solid rgba(114,240,220,.12);padding-top:10px}
#recent{margin-top:18px;padding-top:14px;border-top:1px solid rgba(114,240,220,.12)}
#recentList{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
#recentList button{border-radius:999px;padding:8px 10px;background:rgba(114,240,220,.05);border:1px solid rgba(114,240,220,.12);color:var(--ink);cursor:pointer}
@media (max-width: 560px){header{flex-direction:column;align-items:flex-start}h1{font-size:1.9rem}.lang{align-self:stretch;justify-content:center}.btn,.btn.main{width:100%}.samples{gap:8px}.meta-grid{grid-template-columns:1fr;}} 
</style></head><body><main>
<header><div><h1>Bharat Scan Shield</h1><p class="tag" id="tag">Scan before you trust.</p></div>
<div class="lang" role="group" aria-label="Language"><button id="en" class="on">English</button><button id="hi">हिन्दी</button></div></header>
<div class="hero-badge">AI + rule-based safety checker</div>
<div class="hero-pills">
  <span>Scan</span>
  <span>Verify</span>
  <span>Protect</span>
</div>

<label for="msg" id="lbl" class="hint">Paste the message you received</label>
<textarea id="msg" maxlength="4000"></textarea>
<div class="row">
 <button class="btn main" id="go">Check this message</button>
 <button class="btn secondary" id="copyResult">Copy result</button>
 <button class="btn secondary" id="clearBtn">Clear</button>
 <button class="btn" id="mic">🎤 Speak</button>
 <button class="btn" id="imgbtn">🖼 Upload screenshot</button>
 <input type="file" id="img" accept="image/*" hidden>
</div>
<p class="hint" id="priv">Your message is not saved. Screenshots are read on your own device.</p>
<div class="samples hint"><span id="trysmp">Try a sample:</span> <a id="s1">English</a><a id="s2">हिन्दी</a><a id="s3">Fake SEBI link</a></div>
<div id="status" class="hint" role="status"></div>
<div class="meta-grid" id="metaGrid">
  <div class="meta"><span>Risk score</span><strong id="riskScore">0</strong></div>
  <div class="meta"><span>Signals</span><strong id="signalCount">0</strong></div>
  <div class="meta"><span>Links</span><strong id="linkCount">0</strong></div>
</div>

<section id="out" aria-live="polite">
 <div class="meter"><i></i><i></i><i></i></div>
 <p class="label" id="label"></p><p id="summary"></p>
 <div id="categoryBadges"></div>
 <h2 id="h-sig"></h2><div id="sigs"></div>
 <h2 id="h-steps"></h2><ul id="steps"></ul>
 <p class="disc" id="disc"></p>
</section>
<div id="recent" class="hint">
  <strong>Recent checks</strong>
  <div id="recentList"></div>
</div>
</main>
<script>
const T={en:{tag:"Scan before you trust.",lbl:"Paste the message you received",go:"Check this message",mic:"🎤 Speak",img:"🖼 Upload screenshot",priv:"Your message is not saved. Screenshots are read on your own device.",smp:"Try a sample:",sig:"Warning signs found",steps:"What you can do now",none:"No common warning signs were found.",read:"Reading screenshot…",chk:"Checking…",err:"Could not check. Is the server running?",found:"Found in message: ",copy:"Copied",recent:"Recent checks",clear:"Cleared"},
hi:{tag:"भरोसा करने से पहले जाँचें।",lbl:"जो संदेश मिला उसे यहाँ चिपकाएँ",go:"संदेश जाँचें",mic:"🎤 बोलें",img:"🖼 स्क्रीनशॉट डालें",priv:"आपका संदेश सेव नहीं होता। स्क्रीनशॉट आपके अपने फ़ोन पर पढ़ा जाता है।",smp:"नमूना आज़माएँ:",sig:"मिले चेतावनी संकेत",steps:"अब आप क्या कर सकते हैं",none:"कोई आम चेतावनी संकेत नहीं मिला।",read:"स्क्रीनशॉट पढ़ रहे हैं…",chk:"जाँच रहे हैं…",err:"जाँच नहीं हो सकी। क्या सर्वर चालू है?",found:"संदेश में मिला: ",copy:"कॉपी हो गया",recent:"हाल की जाँचें",clear:"साफ़ हो गया"}};
const SMP={s1:"Invest ₹10,000 today and get ₹50,000 guaranteed in 7 days. Limited seats. Contact immediately. Join our VIP group: https://bit.ly/xyz",
s2:"पक्का मुनाफ़ा! 7 दिन में पैसे दोगुना। सेबी पंजीकृत। आज ही जुड़ें, सीमित सीटें। UPI से ₹5000 जमा करें।",
s3:"Dear investor, your SEBI-approved account needs verification. Enter your OTP at http://sebi-verify.xyz/login now."};
let L="en";const $=id=>document.getElementById(id);
const recentKey="bharat-scan-shield-history";
function ui(){const t=T[L];document.documentElement.lang=L;$("tag").textContent=t.tag;$("lbl").textContent=t.lbl;$("go").textContent=t.go;$("mic").textContent=t.mic;$("imgbtn").textContent=t.img;$("priv").textContent=t.priv;$("trysmp").textContent=t.smp;$("copyResult").textContent=L=="en"?"Copy result":"परिणाम कॉपी करें";$("clearBtn").textContent=L=="en"?"Clear":"साफ़ करें";$("recent").querySelector("strong").textContent=t.recent;
$("en").classList.toggle("on",L=="en");$("hi").classList.toggle("on",L=="hi");}
$("en").onclick=()=>{L="en";ui()};$("hi").onclick=()=>{L="hi";ui()};
["s1","s2","s3"].forEach(k=>$(k).onclick=()=>{$("msg").value=SMP[k]});

function saveRecent(text){
  try{const arr=JSON.parse(localStorage.getItem(recentKey)||"[]");const next=[text,...arr.filter(x=>x!==text)].slice(0,4);localStorage.setItem(recentKey,JSON.stringify(next));renderRecent();}catch(e){}
}
function renderRecent(){
  try{const arr=JSON.parse(localStorage.getItem(recentKey)||"[]");const list=$("recentList");list.innerHTML="";if(!arr.length){const b=document.createElement("span");b.textContent=L=="en"?"No recent checks yet":"अभी कोई हालिया जाँच नहीं है";list.append(b);return;}arr.forEach(item=>{const b=document.createElement("button");b.type="button";b.textContent=item.length>28?item.slice(0,28)+"…":item;b.onclick=()=>{$("msg").value=item;};list.append(b);});}catch(e){}
}

$("go").onclick=async()=>{
 const text=$("msg").value.trim();if(text.length<3)return;
 $("go").disabled=true;$("status").textContent=T[L].chk;
 try{const r=await fetch("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text,lang:L})});
  if(!r.ok)throw 0;const data=await r.json();show(data);saveRecent(text);$("status").textContent="";}
 catch(e){$("status").textContent=T[L].err}
 $("go").disabled=false;};

function show(d){
 const o=$("out");o.className=d.level;o.style.display="block";
 $("label").textContent=d.label;$("summary").textContent=d.summary;
 $("riskScore").textContent=d.stats ? d.stats.risk_score : d.score || 0;
 $("signalCount").textContent=d.stats ? d.stats.signal_count : (d.signals||[]).length;
 $("linkCount").textContent=d.stats ? d.stats.link_count : 0;
 const badges=$("categoryBadges");badges.innerHTML="";
 const categories = Array.isArray(d.categories) && d.categories.length ? d.categories : (d.signals||[]).map(s => s.title.toLowerCase().replace(/\s+/g, "_"));
 categories.forEach(cat => {
   const chip = document.createElement("span");
   chip.className = "badge";
   chip.textContent = cat.replace(/_/g, " ");
   badges.appendChild(chip);
 });
 $("h-sig").textContent=T[L].sig;$("h-steps").textContent=T[L].steps;
 const s=$("sigs");s.innerHTML="";
 if(!d.signals.length){const p=document.createElement("p");p.textContent=T[L].none;s.append(p)}
 d.signals.forEach(x=>{const e=document.createElement("div");e.className="sig";
  const b=document.createElement("b");b.textContent=x.title;
  const w=document.createElement("span");w.textContent=x.why;
  const m=document.createElement("small");m.textContent=T[L].found+x.matched.join(" | ");m.style.display="block";
  e.append(b,w,m);s.append(e)});
 const u=$("steps");u.innerHTML="";d.steps.forEach(t=>{const li=document.createElement("li");li.textContent=t;u.append(li)});
 $("disc").textContent=d.disclaimer;o.scrollIntoView({behavior:"smooth"});}

$("copyResult").onclick=async()=>{
 const text = [$("label").textContent, $("summary").textContent, [...$("sigs").children].map(el=>el.textContent).join("\n")].join("\n\n");
 try{await navigator.clipboard.writeText(text);$("status").textContent=T[L].copy;}catch(e){$("status").textContent="Copy failed";}
};
$("clearBtn").onclick=()=>{$("msg").value="";$("out").style.display="none";$("status").textContent=T[L].clear;};

// Voice input (browser speech API)
$("mic").onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){alert("Voice input is not supported in this browser. Try Chrome.");return}
 const r=new SR();r.lang=L=="hi"?"hi-IN":"en-IN";r.onresult=e=>{$("msg").value+=" "+e.results[0][0].transcript};r.start();};

// Screenshot OCR runs in the browser: image never leaves the device
$("imgbtn").onclick=()=>$("img").click();
$("img").onchange=async e=>{const f=e.target.files[0];if(!f)return;
 $("status").textContent=T[L].read;
 try{const r=await Tesseract.recognize(f,"eng+hin");$("msg").value=r.data.text.trim();$("status").textContent="";}
 catch(x){$("status").textContent=T[L].err}};
renderRecent();ui();
</script></body></html>
